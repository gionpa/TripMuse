spring:
  application:
    name: tripmuse-backend
  profiles:
    active: prod
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 0B  # stream uploads directly to disk to avoid OOM
  cache:
    type: none

server:
  port: 8080

jwt:
  # 기본값을 두지 않는다. 운영에서 JWT_SECRET을 빠뜨리면 기동 자체가 실패하도록 —
  # 고정 기본키가 배포되면 누구나 토큰을 위조할 수 있다.
  # (local 프로필에서는 아래에서 개발용 기본값을 덮어쓴다)
  secret: ${JWT_SECRET}
  access-token-validity-in-seconds: 3600
  refresh-token-validity-in-seconds: 1209600

tripmuse:
  # 공유 링크 URL 생성에 사용되는 외부 공개 주소
  public-base-url: ${PUBLIC_BASE_URL:https://tripmuse-production.up.railway.app}

  # 앱이 실행될 때 비교하는 최신 버전.
  # 새 버전을 올렸으면 아래 두 값을 build.gradle.kts와 똑같이 맞춘다.
  # 급하면 Railway 환경변수로 덮어써도 된다 (앱 재배포 불필요).
  app-version:
    android:
      latest-version-code: ${ANDROID_LATEST_VERSION_CODE:18}
      latest-version-name: ${ANDROID_LATEST_VERSION_NAME:1.7.0}
      # 이 값보다 낮은 버전은 업데이트해야만 앱을 쓸 수 있다.
      # 서버 호환이 깨졌을 때만 올린다 — 올리면 옛 버전 사용자가 즉시 막힌다.
      min-supported-version-code: ${ANDROID_MIN_VERSION_CODE:1}
      release-notes: ${ANDROID_RELEASE_NOTES:알림 센터가 추가되어 친구 접속과 공유 앨범 소식을 한곳에서 볼 수 있어요.}
      download-url: ${ANDROID_DOWNLOAD_URL:https://play.google.com/store/apps/details?id=com.tripmuse}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/tripmuse
    username: tripmuse
    password: tripmuse
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# 로컬 개발 편의를 위한 기본 JWT 키 (운영에는 절대 쓰이지 않는다 — prod는 JWT_SECRET 필수)
jwt:
  secret: ${JWT_SECRET:TripMuseLocalDevSecretKeyMustBe32BytesLong}

storage:
  type: local
  local:
    path: ${user.home}/tripmuse/media

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:tripmuse}
    username: ${PGUSER:tripmuse}
    password: ${PGPASSWORD:tripmuse}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      pool-name: TripMuseHikariPool
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  cache:
    # Redis가 없으면 캐시 비활성화 (CACHE_TYPE=redis로 활성화)
    type: ${CACHE_TYPE:none}
  data:
    redis:
      url: ${REDIS_URL:}

storage:
  type: volume
  volume:
    path: /data/media

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
